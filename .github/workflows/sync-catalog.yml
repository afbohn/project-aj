# Keeps navigation in step with the catalogue as products arrive.
#
# WHY THIS EXISTS. Products come in continuously through Shopify Collective, and
# a product with no price-band tag is invisible to price navigation — it exists
# on the store but cannot be browsed to. A new supplier with no vendor
# collection is worse: the cart upsell looks that collection up by handle, so
# without it, items from that supplier are never suggested. Both gaps are
# silent. Nothing errors; the catalogue is just quietly smaller than it looks.
#
# Running it on a schedule rather than reacting to a webhook is deliberate. Both
# scripts are idempotent — they compute the desired state and change only what
# differs — so running hourly costs almost nothing and needs no server to
# receive webhooks. An hour of latency on a browse facet does not matter.
#
# The alternative was Shopify Flow, which could tag on product-create in near
# real time. Rejected because the band rule (compute from the MINIMUM variant
# price, because that is the price the product card shows) would then live in
# two places and drift, and Flow cannot create collections at all.
#
# SETUP: the same two secrets the sweep job uses.
#     SHOPIFY_CLIENT_ID
#     SHOPIFY_CLIENT_SECRET
#
# The app also needs read_publications and write_publications, or new vendor
# collections are created unpublished and 404 on the storefront. vendors.py
# exits non-zero in that case so this job goes red instead of looking clean.

name: Sync catalog

on:
  schedule:
    # Hourly at :05, offset from the sweep job at :30 so they never contend for
    # the same API rate limit.
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (report only) or apply"
        required: true
        default: dry-run
        type: choice
        options: [dry-run, apply]

concurrency:
  group: sync-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
      SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check configuration
        run: |
          if [ -z "$SHOPIFY_CLIENT_ID" ] || [ -z "$SHOPIFY_CLIENT_SECRET" ]; then
            echo "::error::SHOPIFY_CLIENT_ID / SHOPIFY_CLIENT_SECRET are not set."
            echo "Failing loudly rather than reporting a clean sync that never ran."
            exit 1
          fi

      # A manual run defaults to dry-run so the job can be inspected safely.
      # Scheduled runs always apply — a scheduled dry-run would be pointless.
      - name: Decide mode
        id: mode
        env:
          REQUESTED: ${{ inputs.mode }}
        run: |
          if [ -z "$REQUESTED" ] || [ "$REQUESTED" = "apply" ]; then
            echo "flag=" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--dry-run" >> "$GITHUB_OUTPUT"
          fi

      - name: Price band tags
        run: python3 scripts/bands.py ${{ steps.mode.outputs.flag }}

      # Runs even if bands failed: a missing vendor collection and a missing
      # band tag are independent gaps, and fixing one is better than neither.
      - name: Vendor collections
        if: always()
        run: python3 scripts/vendors.py ${{ steps.mode.outputs.flag }}
