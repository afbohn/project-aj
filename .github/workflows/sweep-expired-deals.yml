# Restores regular pricing on deals whose window has closed.
#
# WHY THIS EXISTS. The theme stops showing a deal the moment ends_at passes,
# but the discounted price stays on the product until something puts it back.
# A deal that ends overnight therefore keeps selling at deal price — sometimes
# at cost — and nothing surfaces that it is happening. It is the most expensive
# way this system can fail and the only one that fails silently.
#
# Runs here rather than on a laptop deliberately: a cron job that only fires
# when someone's Mac happens to be awake is not a safety net.
#
# SETUP (one time):
#   1. Create a custom app in the Shopify Dev Dashboard with Admin API scopes
#      covering products and metaobjects, and install it on the store.
#      (Custom apps can no longer be created in the Shopify admin, and an Admin
#      API token is no longer shown in the UI.)
#   2. GitHub -> repo Settings -> Secrets and variables -> Actions, add two:
#           SHOPIFY_CLIENT_ID
#           SHOPIFY_CLIENT_SECRET
#
# WHY NOT A TOKEN. Shopify's client credentials grant returns a token that
# expires after 24 HOURS. A token pasted into a secret would work today and
# quietly stop working tomorrow — and the failure would look like "the job ran
# and found nothing to do" rather than an error. So the secrets are the ID and
# secret, and scripts/shopify_auth.py mints a fresh token on every run.
#
# Neither value is ever printed; both reach the script through the environment.

name: Sweep expired deals

on:
  schedule:
    # Every hour on the half hour. Hourly is the useful granularity here —
    # the exposure window is at most an hour of selling at deal price, and
    # GitHub's scheduler is approximate anyway under load.
    - cron: "30 * * * *"
  # Lets you run it by hand from the Actions tab, which is also how you verify
  # the token works without waiting for the hour to turn.
  workflow_dispatch:

# Two runs repricing the same product at once would be pointless rather than
# harmful — sweep is idempotent — but serialising keeps the logs readable.
concurrency:
  group: sweep-expired-deals
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No dependencies to install: deal.py uses only the standard library,
      # specifically so this job stays a checkout and a run.
      - name: Sweep
        env:
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: |
          if [ -z "$SHOPIFY_CLIENT_ID" ] || [ -z "$SHOPIFY_CLIENT_SECRET" ]; then
            echo "::error::SHOPIFY_CLIENT_ID / SHOPIFY_CLIENT_SECRET are not set."
            echo "See the setup notes at the top of this workflow. Failing loudly"
            echo "rather than reporting a clean sweep that never ran."
            exit 1
          fi
          python3 scripts/deal.py sweep
